# SonarQube Cloud automatic-analysis configuration.
# Keep the project version stable between releases: the inherited "previous version"
# New Code strategy is meaningful only when sonar.projectVersion is explicitly set.
sonar.projectVersion=1.0.0

# Analyze executable/operational code, CI/IaC and migrations. Historical learning
# archives and narrative documentation are intentionally outside the source baseline.
sonar.sources=.github,build,functions,infra,migrations,public,scripts,server,shared,src,workers,eslint.config.js,index.html,vite.config.ts,vite.student-portal.config.ts,vitest.config.ts,wrangler.jsonc,wrangler.student-portal.jsonc,wrangler.student-portal-edge.jsonc
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Phrase catalogs are wording data with same-meaning variants by design (#1132); keep them out of
# copy-paste detection only. They are still analyzed as sources.
sonar.cpd.exclusions=shared/student-portal-contracts/term-closing-catalog-v1.ts

# Applied, hash-verified migrations are immutable history: their repeated role/table literals
# cannot be refactored without rewriting what production already executed.
sonar.exclusions=migrations/attendance/0001_frequency_v2.sql,migrations/collector/0002_pending_pairings.sql,migrations/gradebook-simplified/0003_council_session_v3.sql,migrations/gradebook-simplified/0012_current_state_cleanup_v1.sql,migrations/student-portal/0008_atomic_publication_v2.sql

# Oracle PL/SQL rules that do not fit PostgreSQL migrations (docs/sonar-limpeza.md, step 2): applied
# migrations are immutable history, and a repeated role/table name is clearer than a variable in SQL.
sonar.issue.ignore.multicriteria=plsqlLiteral,plsqlExists,asyncPort
sonar.issue.ignore.multicriteria.plsqlLiteral.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.plsqlLiteral.resourceKey=**/*.sql
sonar.issue.ignore.multicriteria.plsqlExists.ruleKey=plsql:S1138
sonar.issue.ignore.multicriteria.plsqlExists.resourceKey=**/*.sql

# typescript:S7503 (async without await): the flagged methods implement Promise-returning ports
# (stores, crypto, live updates). `async` is deliberate there: a synchronous throw (validation, a
# missing key) must reach the caller as a rejected promise, as the port's contract says. Removing
# it would change behaviour. docs/sonar-limpeza.md, step 6.
sonar.issue.ignore.multicriteria.asyncPort.ruleKey=typescript:S7503
sonar.issue.ignore.multicriteria.asyncPort.resourceKey=**/*
