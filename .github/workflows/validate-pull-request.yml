name: Validate pull request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Detect effective pull request changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      has_changes: ${{ steps.scope.outputs.has_changes }}
    steps:
      - name: Checkout for diff classification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect effective pull request diff
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "${PR_BASE_SHA}...${PR_HEAD_SHA}" --; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No effective file changes; heavy validation is skipped."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  photo-codec:
    needs: scope
    if: needs.scope.outputs.has_changes == 'true'
    uses: ./.github/workflows/student-photo-codec-proof.yml

  verify:
    needs: [scope, photo-codec]
    if: needs.scope.outputs.has_changes == 'true'
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore source-built photo codec from this exact workflow
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: student-photo-codec-proof-v1
          path: node_modules/.cache/student-photo-codec-v1

      - name: Verify codec provenance before bundling
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/student-photos/verify-codec-artifact-v1.mjs

      - name: Verify
        run: npm run verify

      - name: Bundle administrative Pages Functions with the actual codec
        run: ./node_modules/.bin/wrangler pages functions build --outdir node_modules/.cache/photo-pages-build --compatibility-date 2026-08-24 --compatibility-flags nodejs_compat

      - name: Stage exact validated production inputs
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rm -rf production-inputs
          mkdir -p production-inputs/node_modules/.cache
          cp -a dist production-inputs/dist
          cp -a node_modules/.cache/student-photo-codec-v1 production-inputs/node_modules/.cache/student-photo-codec-v1
          cp -a node_modules/.cache/student-portal-edge production-inputs/node_modules/.cache/student-portal-edge
          cp -a node_modules/.cache/public-portal-demo production-inputs/node_modules/.cache/public-portal-demo
          cp -a node_modules/.cache/public-demo-worker production-inputs/node_modules/.cache/public-demo-worker
          node --experimental-strip-types scripts/ci/provenance-v1.ts write validate-pull-request production-inputs/validate-provenance.json
          test -f production-inputs/dist/index.html
          test -f production-inputs/node_modules/.cache/student-portal-edge/_worker.js
          test -f production-inputs/node_modules/.cache/public-portal-demo/index.html
          test -f production-inputs/node_modules/.cache/public-demo-worker/index.js

      - name: Upload exact validated production inputs
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-production-inputs-v1
          path: production-inputs/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
