name: Student photo codec proof
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: student-photo-codec-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  workerd-codec:
    name: Source-built WebP in local Workerd
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Verify that the event base is an ancestor of the fetched main
          # when GitHub regenerates the PR synthetic merge after new merges.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reject missing or ambiguous archive discovery
        run: node tests/student-photos/codec-proof/archive-guard.mjs
      - name: Checkout pinned libwebp source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: webmproject/libwebp
          ref: 4fa21912338357f89e4fd51cf2368325b59e9bd9
          path: node_modules/.cache/student-photo-codec-source
          persist-credentials: false
      - name: Checkout pinned compiler installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: emscripten-core/emsdk
          ref: 389a68bc35dcff7ebae4614e1615099dafda00d1
          path: node_modules/.cache/student-photo-codec-emsdk
          persist-credentials: false
      - name: Install explicit Emscripten version
        working-directory: node_modules/.cache/student-photo-codec-emsdk
        run: |
          test "$(git rev-parse HEAD)" = 389a68bc35dcff7ebae4614e1615099dafda00d1
          ./emsdk install 4.0.15
          ./emsdk activate 4.0.15
      - name: Build bounded module from pinned source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          source node_modules/.cache/student-photo-codec-emsdk/emsdk_env.sh
          bash scripts/student-photos/codec-v1/build.sh
      - name: Package test-only Worker without deployment
        run: npx wrangler deploy --dry-run --config tests/student-photos/codec-proof/wrangler.jsonc --outdir "$PWD/node_modules/.cache/student-photo-codec-proof"
      - name: Exercise real codec in local Workerd with synthetic images
        run: node tests/student-photos/codec-proof/verify.mjs
      - name: Preserve proof, binary and upstream notices
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: student-photo-codec-proof-v1
          path: node_modules/.cache/student-photo-codec-v1/
          if-no-files-found: error
          retention-days: 7
