name: Entra Maintenance

on:
  pull_request:
    paths:
      - '.github/workflows/entra-maintenance.yml'
      - 'scripts/entra/maintenance-plan.ts'
      - 'scripts/entra/certificate-validity.ts'
      - 'scripts/entra/maintenance-rotate.ts'
      - 'scripts/entra/validate-runtime-credential.ts'
      - 'tests/entra/certificate-validity.test.ts'
      - 'tests/entra/maintenance-plan.test.ts'
      - 'tests/entra/maintenance-rotate.test.ts'
      - 'tests/entra/validate-runtime-credential.test.ts'
      - 'docs/infra/ENTRA_MAINTENANCE_OIDC.md'
  workflow_dispatch:
    inputs:
      action:
        description: Maintenance operation
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - rotate
          - finalize
          - repair-orphan
      target:
        description: Application target
        required: true
        default: web
        type: choice
        options:
          - web
          - graph
      slot:
        description: A/B slot (rotate must select the currently inactive slot)
        required: true
        default: A
        type: choice
        options:
          - A
          - B

permissions: {}

concurrency:
  group: entra-maintenance
  cancel-in-progress: false

jobs:
  validate-definition:
    name: Validate Entra Maintenance workflow definition
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify bounded Maintenance workflow
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/entra/maintenance-plan.ts
          test -f scripts/entra/certificate-validity.ts
          test -f scripts/entra/maintenance-rotate.ts
          test -f scripts/entra/validate-runtime-credential.ts
          test -f tests/entra/certificate-validity.test.ts
          test -f tests/entra/maintenance-plan.test.ts
          test -f tests/entra/maintenance-rotate.test.ts
          test -f tests/entra/validate-runtime-credential.test.ts
          test -f docs/infra/ENTRA_MAINTENANCE_OIDC.md
          grep -Fq 'environment: maintenance' .github/workflows/entra-maintenance.yml
          grep -Fq 'id-token: write' .github/workflows/entra-maintenance.yml
          grep -Fq 'Application.ReadWrite.OwnedBy' docs/infra/ENTRA_MAINTENANCE_OIDC.md
          grep -Fq 'pages secret put' .github/workflows/entra-maintenance.yml
          grep -Fq -- 'secret put "$SECRET_NAME"                 --config wrangler.notas-onedrive-sync.jsonc' .github/workflows/entra-maintenance.yml
          grep -Fq 'deploy-cloudflare-pages.yml' .github/workflows/entra-maintenance.yml
          grep -Fq 'repair-orphan' .github/workflows/entra-maintenance.yml
          node --experimental-strip-types -e "import('./scripts/entra/validate-runtime-credential.ts')"
          ! grep -Eq "method: ['\"](POST|PATCH|DELETE)['\"]" scripts/entra/maintenance-plan.ts

  dry-run:
    name: Plan Maintenance via OIDC
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'dry-run'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: maintenance
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Enforce trusted main and required variables
        shell: bash
        env:
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_MAINTENANCE_CLIENT_ID: ${{ vars.ENTRA_MAINTENANCE_CLIENT_ID }}
          WEB_APPLICATION_OBJECT_ID: ${{ vars.WEB_APPLICATION_OBJECT_ID }}
          GRAPH_APPLICATION_OBJECT_ID: ${{ vars.GRAPH_APPLICATION_OBJECT_ID }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          uuid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          for value in "$ENTRA_TENANT_ID" "$ENTRA_MAINTENANCE_CLIENT_ID" "$WEB_APPLICATION_OBJECT_ID" "$GRAPH_APPLICATION_OBJECT_ID"; do
            [[ "$value" =~ $uuid ]] || {
              echo "::error::A required Entra/GitHub variable is missing or invalid."
              exit 1
            }
          done

      - name: Exchange GitHub OIDC assertion for short-lived Graph token
        shell: bash
        env:
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_MAINTENANCE_CLIENT_ID: ${{ vars.ENTRA_MAINTENANCE_CLIENT_ID }}
        run: |
          set -euo pipefail
          oidc_response="$(
            curl --silent --show-error --fail               -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2FAzureADTokenExchange"
          )"
          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          test -n "$oidc_token"
          echo "::add-mask::$oidc_token"
          entra_response="$(
            curl --silent --show-error --fail               -X POST               -H 'Content-Type: application/x-www-form-urlencoded'               --data-urlencode "client_id=${ENTRA_MAINTENANCE_CLIENT_ID}"               --data-urlencode 'scope=https://graph.microsoft.com/.default'               --data-urlencode 'grant_type=client_credentials'               --data-urlencode 'client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer'               --data-urlencode "client_assertion=${oidc_token}"               "https://login.microsoftonline.com/${ENTRA_TENANT_ID}/oauth2/v2.0/token"
          )"
          graph_token="$(jq -r '.access_token // empty' <<<"$entra_response")"
          test -n "$graph_token"
          echo "::add-mask::$graph_token"
          printf '%s' "$graph_token" > "$RUNNER_TEMP/graph-access-token"
          chmod 600 "$RUNNER_TEMP/graph-access-token"
          unset oidc_token graph_token oidc_response entra_response

      - name: Run sanitized Maintenance dry-run
        shell: bash
        env:
          ENTRA_MAINTENANCE_CLIENT_ID: ${{ vars.ENTRA_MAINTENANCE_CLIENT_ID }}
          WEB_APPLICATION_OBJECT_ID: ${{ vars.WEB_APPLICATION_OBJECT_ID }}
          GRAPH_APPLICATION_OBJECT_ID: ${{ vars.GRAPH_APPLICATION_OBJECT_ID }}
        run: |
          set -euo pipefail
          token="$(cat "$RUNNER_TEMP/graph-access-token")"
          test -n "$token"
          echo "::add-mask::$token"
          output="$RUNNER_TEMP/entra-maintenance-plan.json"
          trap 'rm -f "$RUNNER_TEMP/graph-access-token" "$RUNNER_TEMP/entra-maintenance-plan.json"' EXIT
          GRAPH_ACCESS_TOKEN="$token"             ENTRA_MAINTENANCE_CLIENT_ID="$ENTRA_MAINTENANCE_CLIENT_ID"             WEB_APPLICATION_OBJECT_ID="$WEB_APPLICATION_OBJECT_ID"             GRAPH_APPLICATION_OBJECT_ID="$GRAPH_APPLICATION_OBJECT_ID"             node --experimental-strip-types scripts/entra/maintenance-plan.ts > "$output"
          rm -f "$RUNNER_TEMP/graph-access-token"
          unset token
          jq -e '
            .status == "ready" and
            .identity.applicationPermissions == ["Application.ReadWrite.OwnedBy"] and
            (.identity.ownedApplicationObjectIds | length) == 2 and
            (.targets.web.keyCredentials | length) > 0 and
            (.targets.graph.keyCredentials | length) > 0
          ' "$output" >/dev/null
          {
            echo "### Entra Maintenance dry-run"
            echo
            jq -r '
              "- Permission set: " + (.identity.applicationPermissions | join(", ")),
              "- Owned targets: " + ((.identity.ownedApplicationObjectIds | length) | tostring),
              "- Web certificates: " + ((.targets.web.keyCredentials | length) | tostring) +
                ", password credentials: " + (.targets.web.passwordCredentialCount | tostring) +
                ", preservation material readable: " +
                (if .targets.web.allCertificateMaterialReadable then "yes" else "no" end),
              "- Graph certificates: " + ((.targets.graph.keyCredentials | length) | tostring) +
                ", password credentials: " + (.targets.graph.passwordCredentialCount | tostring) +
                ", preservation material readable: " +
                (if .targets.graph.allCertificateMaterialReadable then "yes" else "no" end),
              "- Result: ready; no Entra mutation executed"
            ' "$output"
          } >> "$GITHUB_STEP_SUMMARY"

  write:
    name: Apply bounded Maintenance rotation
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'dry-run'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: maintenance
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Enforce trusted main and required configuration
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          TARGET: ${{ inputs.target }}
          SLOT: ${{ inputs.slot }}
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_MAINTENANCE_CLIENT_ID: ${{ vars.ENTRA_MAINTENANCE_CLIENT_ID }}
          WEB_APPLICATION_OBJECT_ID: ${{ vars.WEB_APPLICATION_OBJECT_ID }}
          GRAPH_APPLICATION_OBJECT_ID: ${{ vars.GRAPH_APPLICATION_OBJECT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          [[ "$ACTION" == "rotate" || "$ACTION" == "finalize" || "$ACTION" == "repair-orphan" ]]
          [[ "$TARGET" == "web" || "$TARGET" == "graph" ]]
          [[ "$SLOT" == "A" || "$SLOT" == "B" ]]
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          if [ "$ACTION" = "rotate" ]; then test -n "$CLOUDFLARE_API_TOKEN"; fi
          uuid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          for value in "$ENTRA_TENANT_ID" "$ENTRA_MAINTENANCE_CLIENT_ID" "$WEB_APPLICATION_OBJECT_ID" "$GRAPH_APPLICATION_OBJECT_ID"; do
            [[ "$value" =~ $uuid ]] || exit 1
          done

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Exchange GitHub OIDC assertion for short-lived Graph token
        shell: bash
        env:
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_MAINTENANCE_CLIENT_ID: ${{ vars.ENTRA_MAINTENANCE_CLIENT_ID }}
        run: |
          set -euo pipefail
          oidc_response="$(
            curl --silent --show-error --fail               -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2FAzureADTokenExchange"
          )"
          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          test -n "$oidc_token"
          echo "::add-mask::$oidc_token"
          entra_response="$(
            curl --silent --show-error --fail               -X POST               -H 'Content-Type: application/x-www-form-urlencoded'               --data-urlencode "client_id=${ENTRA_MAINTENANCE_CLIENT_ID}"               --data-urlencode 'scope=https://graph.microsoft.com/.default'               --data-urlencode 'grant_type=client_credentials'               --data-urlencode 'client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer'               --data-urlencode "client_assertion=${oidc_token}"               "https://login.microsoftonline.com/${ENTRA_TENANT_ID}/oauth2/v2.0/token"
          )"
          graph_token="$(jq -r '.access_token // empty' <<<"$entra_response")"
          test -n "$graph_token"
          echo "::add-mask::$graph_token"
          printf '%s' "$graph_token" > "$RUNNER_TEMP/graph-access-token"
          chmod 600 "$RUNNER_TEMP/graph-access-token"
          unset oidc_token graph_token oidc_response entra_response

      - name: Prove minimal permission, exact ownership and preservation readiness
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          TARGET: ${{ inputs.target }}
          ENTRA_MAINTENANCE_CLIENT_ID: ${{ vars.ENTRA_MAINTENANCE_CLIENT_ID }}
          WEB_APPLICATION_OBJECT_ID: ${{ vars.WEB_APPLICATION_OBJECT_ID }}
          GRAPH_APPLICATION_OBJECT_ID: ${{ vars.GRAPH_APPLICATION_OBJECT_ID }}
        run: |
          set -euo pipefail
          token="$(cat "$RUNNER_TEMP/graph-access-token")"
          echo "::add-mask::$token"
          output="$RUNNER_TEMP/entra-maintenance-plan.json"
          GRAPH_ACCESS_TOKEN="$token"             ENTRA_MAINTENANCE_CLIENT_ID="$ENTRA_MAINTENANCE_CLIENT_ID"             WEB_APPLICATION_OBJECT_ID="$WEB_APPLICATION_OBJECT_ID"             GRAPH_APPLICATION_OBJECT_ID="$GRAPH_APPLICATION_OBJECT_ID"             node --experimental-strip-types scripts/entra/maintenance-plan.ts > "$output"
          jq -e '
            .status == "ready" and
            .identity.applicationPermissions == ["Application.ReadWrite.OwnedBy"] and
            (.identity.ownedApplicationObjectIds | length) == 2 and
            .targets.web.allCertificateMaterialReadable == true and
            .targets.graph.allCertificateMaterialReadable == true and
            .targets.web.passwordCredentialCount == 0 and
            .targets.graph.passwordCredentialCount == 0
          ' "$output" >/dev/null
          if [ "$ACTION" = "rotate" ]; then
            jq -e --arg target "$TARGET" '(.targets[$target].keyCredentials | length) == 2' "$output" >/dev/null || {
              echo "::error::Rotation target is not in the expected two-certificate steady state."
              exit 1
            }
          fi
          if [ "$ACTION" = "repair-orphan" ]; then
            jq -e --arg target "$TARGET" '
              ((.targets[$target].keyCredentials | length) == 2) or
              ((.targets[$target].keyCredentials | length) == 3)
            ' "$output" >/dev/null || {
              echo "::error::Orphan repair requires exactly two or three certificates on the selected target."
              exit 1
            }
          fi

      - name: Resolve bounded target
        id: target
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          SLOT: ${{ inputs.slot }}
          WEB_APPLICATION_OBJECT_ID: ${{ vars.WEB_APPLICATION_OBJECT_ID }}
          GRAPH_APPLICATION_OBJECT_ID: ${{ vars.GRAPH_APPLICATION_OBJECT_ID }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "web" ]; then
            echo "object_id=$WEB_APPLICATION_OBJECT_ID" >> "$GITHUB_OUTPUT"
            echo "client_id=78185e20-c824-4acc-9ccd-41b9f7509a6f" >> "$GITHUB_OUTPUT"
            echo "secret_name=WEB_CREDENTIAL_$SLOT" >> "$GITHUB_OUTPUT"
          else
            echo "object_id=$GRAPH_APPLICATION_OBJECT_ID" >> "$GITHUB_OUTPUT"
            echo "client_id=7d565352-1f77-4a7c-a4a4-4ae1b55b5c0c" >> "$GITHUB_OUTPUT"
            echo "secret_name=GRAPH_CREDENTIAL_$SLOT" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate candidate certificate and runtime credential
        if: inputs.action == 'rotate'
        id: candidate
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          SLOT: ${{ inputs.slot }}
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/maintenance-rotation"
          rm -rf "$dir"
          mkdir -p "$dir"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$dir/private.pem" >/dev/null 2>&1
          openssl req -new -x509 -key "$dir/private.pem" -out "$dir/cert.pem" -days 180 -sha256             -subj "/CN=ecossistema-${TARGET}-${SLOT}-${GITHUB_RUN_ID}" >/dev/null 2>&1
          openssl x509 -in "$dir/cert.pem" -outform DER -out "$dir/cert.der"
          thumbprint="$(openssl dgst -sha1 -binary "$dir/cert.der" | base64 | tr '+/' '-_' | tr -d '=\n')"
          printf '%s' "$thumbprint" > "$dir/thumbprint"
          chmod 600 "$dir/thumbprint"
          validity="$(node --experimental-strip-types scripts/entra/certificate-validity.ts)"
          created_at="$(jq -er '.startDateTime' <<<"$validity")"
          end_at="$(jq -er '.endDateTime' <<<"$validity")"
          display_name="automatic-${TARGET}-slot-${SLOT}-${created_at}"
          echo "created_at=$created_at" >> "$GITHUB_OUTPUT"
          echo "end_at=$end_at" >> "$GITHUB_OUTPUT"
          echo "display_name=$display_name" >> "$GITHUB_OUTPUT"

      - name: Add certificate, prove exact runtime slot and update inactive Pages secret
        if: inputs.action == 'rotate'
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          SLOT: ${{ inputs.slot }}
          APPLICATION_OBJECT_ID: ${{ steps.target.outputs.object_id }}
          TARGET_CLIENT_ID: ${{ steps.target.outputs.client_id }}
          SECRET_NAME: ${{ steps.target.outputs.secret_name }}
          NEW_START_DATE_TIME: ${{ steps.candidate.outputs.created_at }}
          NEW_END_DATE_TIME: ${{ steps.candidate.outputs.end_at }}
          NEW_DISPLAY_NAME: ${{ steps.candidate.outputs.display_name }}
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/maintenance-rotation"
          token="$(cat "$RUNNER_TEMP/graph-access-token")"
          echo "::add-mask::$token"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          secret_written=false
          graph_key_id=""
          rollback() {
            status=$?
            if [ "$status" -ne 0 ] && [ "$secret_written" != "true" ] && [ -n "$graph_key_id" ]; then
              rollback_ok=false
              for _rollback_attempt in 1 2 3; do
                if GRAPH_ACCESS_TOKEN="$token" ROTATION_ACTION=remove-exact ROTATION_TARGET="$TARGET"                   APPLICATION_OBJECT_ID="$APPLICATION_OBJECT_ID" KEY_ID_TO_REMOVE="$graph_key_id"                   node --experimental-strip-types scripts/entra/maintenance-rotate.ts > "$RUNNER_TEMP/rollback-result.json" 2>/dev/null; then
                  rollback_ok=true
                  break
                fi
                sleep 2
              done
              if [ "$rollback_ok" != "true" ]; then
                echo "::warning::Automatic certificate rollback did not complete; use repair-orphan before another rotate."
              fi
            fi
            rm -rf "$dir"
            exit "$status"
          }
          trap rollback EXIT

          GRAPH_ACCESS_TOKEN="$token" ROTATION_ACTION=add ROTATION_TARGET="$TARGET" ROTATION_SLOT="$SLOT"             APPLICATION_OBJECT_ID="$APPLICATION_OBJECT_ID"             CERT_DER_PATH="$dir/cert.der" NEW_DISPLAY_NAME="$NEW_DISPLAY_NAME"             NEW_START_DATE_TIME="$NEW_START_DATE_TIME" NEW_END_DATE_TIME="$NEW_END_DATE_TIME"             node --experimental-strip-types scripts/entra/maintenance-rotate.ts > "$RUNNER_TEMP/add-result.json"
          graph_key_id="$(jq -r '.newGraphKeyId // empty' "$RUNNER_TEMP/add-result.json")"
          [[ "$graph_key_id" =~ ^[0-9a-fA-F-]{36}$ ]]
          KEY_PATH="$dir/private.pem" THUMBPRINT="$(cat "$dir/thumbprint")" KEY_ID="$graph_key_id" CREATED_AT="$NEW_START_DATE_TIME"             node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const value = {
            privateKeyPkcs8: readFileSync(process.env.KEY_PATH, 'utf8'),
            certificateThumbprint: process.env.THUMBPRINT,
            keyId: process.env.KEY_ID,
            createdAt: process.env.CREATED_AT,
          };
          writeFileSync(process.env.RUNNER_TEMP + '/maintenance-rotation/credential.json', JSON.stringify(value), { mode: 0o600 });
          NODE

          validated=false
          for _attempt in {1..60}; do
            if ROTATION_TARGET="$TARGET" ROTATION_SLOT="$SLOT" ENTRA_TENANT_ID="$ENTRA_TENANT_ID"               TARGET_CLIENT_ID="$TARGET_CLIENT_ID" CREDENTIAL_FILE="$dir/credential.json"               node --experimental-strip-types scripts/entra/validate-runtime-credential.ts > "$RUNNER_TEMP/validation.json"; then
              validated=true
              break
            fi

            http_status="$(jq -r '.httpStatus // empty' "$RUNNER_TEMP/validation.json" 2>/dev/null || true)"
            aadsts_code="$(jq -r '.aadstsCode // empty' "$RUNNER_TEMP/validation.json" 2>/dev/null || true)"
            local_kind="$(jq -r '.kind // empty' "$RUNNER_TEMP/validation.json" 2>/dev/null || true)"
            retryable=false
            if [ "$aadsts_code" = "700027" ]; then retryable=true; fi
            if [ "$http_status" = "401" ] && [ -z "$aadsts_code" ]; then retryable=true; fi
            if [ "$http_status" = "429" ] || [[ "$http_status" =~ ^5[0-9][0-9]$ ]]; then retryable=true; fi
            if [ "$local_kind" = "transport" ]; then retryable=true; fi

            if [ "$_attempt" -eq 1 ] || [ $((_attempt % 6)) -eq 0 ]; then
              echo "Credential propagation pending: attempt=$_attempt http=${http_status:-unknown} aadsts=${aadsts_code:-none} local=${local_kind:-none}"
            fi
            if [ "$retryable" != "true" ]; then
              echo "::error::Exact credential validation returned a non-retryable response (HTTP ${http_status:-unknown}, AADSTS ${aadsts_code:-none}, local ${local_kind:-none})."
              break
            fi
            sleep 10
          done
          test "$validated" = "true"
          jq -e --arg target "$TARGET" --arg slot "$SLOT" --arg key "$graph_key_id"             '.status == "ok" and .target == $target and .slot == $slot and .credentialKeyId == $key'             "$RUNNER_TEMP/validation.json" >/dev/null
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"

          cat "$dir/credential.json" | ./node_modules/.bin/wrangler pages secret put "$SECRET_NAME"             --project-name ecossistema-escola >/dev/null
          secret_written=true
          # The Notas OneDrive sync Worker uses the same Graph application: give it the same slot.
          # It is published by deploy-cloudflare-pages.yml; never create it from here.
          if [ "$TARGET" = "graph" ]; then
            if ./node_modules/.bin/wrangler deployments list --config wrangler.notas-onedrive-sync.jsonc >/dev/null 2>&1; then
              cat "$dir/credential.json" | ./node_modules/.bin/wrangler secret put "$SECRET_NAME"                 --config wrangler.notas-onedrive-sync.jsonc >/dev/null
            else
              echo "::warning::Worker notas-onedrive-sync not found; its $SECRET_NAME was not updated."
            fi
          fi
          rm -f "$RUNNER_TEMP/add-result.json" "$RUNNER_TEMP/validation.json"
          rm -rf "$dir"
          trap - EXIT


      - name: Repair orphan certificate from a failed pre-secret rotation
        if: inputs.action == 'repair-orphan'
        id: repair
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          SLOT: ${{ inputs.slot }}
          APPLICATION_OBJECT_ID: ${{ steps.target.outputs.object_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          token="$(cat "$RUNNER_TEMP/graph-access-token")"
          echo "::add-mask::$token"
          plan="$RUNNER_TEMP/entra-maintenance-plan.json"
          prefix="automatic-${TARGET}-slot-${SLOT}-"
          opposite_slot="$([ "$SLOT" = "A" ] && printf 'B' || printf 'A')"
          opposite_prefix="automatic-${TARGET}-slot-${opposite_slot}-"

          certificate_count="$(jq -r --arg target "$TARGET" '.targets[$target].keyCredentials | length' "$plan")"
          if [ "$certificate_count" = "2" ]; then
            jq -e --arg target "$TARGET" --arg prefix "$prefix" --arg opposite "$opposite_prefix" '
              ([.targets[$target].keyCredentials[] | select(.displayName | startswith($prefix))] | length) == 1 and
              ([.targets[$target].keyCredentials[] | select(.displayName | startswith($opposite))] | length) == 1
            ' "$plan" >/dev/null
            echo "status=already-clean" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test "$certificate_count" = "3"
          jq -e --arg target "$TARGET" --arg prefix "$prefix" --arg opposite "$opposite_prefix" '
            ([.targets[$target].keyCredentials[] | select(.displayName | startswith($prefix))] | length) == 2 and
            ([.targets[$target].keyCredentials[] | select(.displayName | startswith($opposite))] | length) == 1
          ' "$plan" >/dev/null

          candidate_key_id="$(jq -r --arg target "$TARGET" --arg prefix "$prefix" '
            [.targets[$target].keyCredentials[] | select(.displayName | startswith($prefix))]
            | sort_by(.startDateTime) | last | .keyId // empty
          ' "$plan")"
          candidate_start="$(jq -r --arg target "$TARGET" --arg prefix "$prefix" '
            [.targets[$target].keyCredentials[] | select(.displayName | startswith($prefix))]
            | sort_by(.startDateTime) | last | .startDateTime // empty
          ' "$plan")"
          test -n "$candidate_key_id"
          test -n "$candidate_start"

          CANDIDATE_START="$candidate_start" node --input-type=module <<'NODE'
          const started = Date.parse(process.env.CANDIDATE_START ?? '');
          if (!Number.isFinite(started)) process.exit(1);
          const ageMs = Date.now() - started;
          if (ageMs < 0 || ageMs > 24 * 60 * 60 * 1000) process.exit(1);
          NODE

          response="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-cloudflare-pages.yml/runs?event=workflow_dispatch&branch=main&per_page=50")"
          post_candidate_success="$(jq -r --arg started "$candidate_start" '
            [.workflow_runs[] | select(.conclusion == "success" and .created_at > $started)] | length
          ' <<<"$response")"
          test "$post_candidate_success" = "0" || {
            echo "::error::Refusing orphan repair because a successful manual production deploy exists after the candidate certificate."
            exit 1
          }

          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"

          GRAPH_ACCESS_TOKEN="$token" ROTATION_ACTION=remove-exact ROTATION_TARGET="$TARGET"             APPLICATION_OBJECT_ID="$APPLICATION_OBJECT_ID" KEY_ID_TO_REMOVE="$candidate_key_id"             node --experimental-strip-types scripts/entra/maintenance-rotate.ts > "$RUNNER_TEMP/repair-result.json"
          jq -e '.status == "removed" and .remainingCertificates == 2' "$RUNNER_TEMP/repair-result.json" >/dev/null

          verify="$RUNNER_TEMP/entra-maintenance-after-repair.json"
          GRAPH_ACCESS_TOKEN="$token"             ENTRA_MAINTENANCE_CLIENT_ID="${{ vars.ENTRA_MAINTENANCE_CLIENT_ID }}"             WEB_APPLICATION_OBJECT_ID="${{ vars.WEB_APPLICATION_OBJECT_ID }}"             GRAPH_APPLICATION_OBJECT_ID="${{ vars.GRAPH_APPLICATION_OBJECT_ID }}"             node --experimental-strip-types scripts/entra/maintenance-plan.ts > "$verify"
          jq -e --arg target "$TARGET" '
            (.targets[$target].keyCredentials | length) == 2 and
            .targets[$target].passwordCredentialCount == 0
          ' "$verify" >/dev/null
          echo "status=removed" >> "$GITHUB_OUTPUT"

      - name: Deploy the exact trusted main through the official production workflow
        if: inputs.action == 'rotate'
        id: deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before_id="$(gh api --method GET             "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-cloudflare-pages.yml/runs?event=workflow_dispatch&branch=main&per_page=20"             --jq '[.workflow_runs[].id] | max // 0')"
          gh workflow run deploy-cloudflare-pages.yml --ref main
          run_id=""
          for _attempt in {1..30}; do
            response="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-cloudflare-pages.yml/runs?event=workflow_dispatch&branch=main&per_page=20")"
            run_id="$(jq -r --argjson before "$before_id" --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.id > $before and .head_sha == $sha)] | sort_by(.id) | last | .id // empty' <<<"$response")"
            [ -n "$run_id" ] && break
            sleep 2
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --exit-status

      - name: Verify a successful post-rotation production deployment before finalize
        if: inputs.action == 'finalize'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
          SLOT: ${{ inputs.slot }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/entra-maintenance-plan.json"
          prefix="automatic-${TARGET}-slot-${SLOT}-"
          latest_start="$(jq -r --arg target "$TARGET" --arg prefix "$prefix" '
            .targets[$target].keyCredentials
            | map(select(.displayName | startswith($prefix)))
            | sort_by(.startDateTime)
            | last
            | .startDateTime // empty
          ' "$plan")"
          test -n "$latest_start"
          response="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-cloudflare-pages.yml/runs?event=workflow_dispatch&branch=main&per_page=50")"
          run_id="$(jq -r --arg sha "$GITHUB_SHA" --arg started "$latest_start" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success" and .created_at > $started)] | sort_by(.id) | last | .id // empty' <<<"$response")"
          test -n "$run_id"

      - name: Finalize rotation by removing only the stale same-slot certificate
        if: inputs.action == 'finalize'
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          SLOT: ${{ inputs.slot }}
          APPLICATION_OBJECT_ID: ${{ steps.target.outputs.object_id }}
        run: |
          set -euo pipefail
          token="$(cat "$RUNNER_TEMP/graph-access-token")"
          echo "::add-mask::$token"
          GRAPH_ACCESS_TOKEN="$token" ROTATION_ACTION=finalize ROTATION_TARGET="$TARGET" ROTATION_SLOT="$SLOT"             APPLICATION_OBJECT_ID="$APPLICATION_OBJECT_ID"             node --experimental-strip-types scripts/entra/maintenance-rotate.ts > "$RUNNER_TEMP/finalize-result.json"
          jq -e '.status == "finalized"' "$RUNNER_TEMP/finalize-result.json" >/dev/null

      - name: Publish sanitized Maintenance result
        if: success()
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          TARGET: ${{ inputs.target }}
          SLOT: ${{ inputs.slot }}
          DEPLOY_RUN_ID: ${{ steps.deploy.outputs.run_id }}
          REPAIR_STATUS: ${{ steps.repair.outputs.status }}
        run: |
          set -euo pipefail
          {
            echo "### Entra Maintenance"
            echo
            echo "- Action: $ACTION"
            echo "- Target: $TARGET"
            echo "- Slot: $SLOT"
            if [ "$ACTION" = "rotate" ]; then
              echo "- Exact slot authentication: passed"
              echo "- Cloudflare secret update: passed"
              echo "- Official production deploy: success (run $DEPLOY_RUN_ID)"
              echo "- Rollback certificate: retained"
              echo "- Stale same-slot certificate: retained until finalize"
            elif [ "$ACTION" = "repair-orphan" ]; then
              if [ "$REPAIR_STATUS" = "already-clean" ]; then
                echo "- Target certificate count: already 2; no Entra mutation needed"
              else
                echo "- Failed pre-secret rotation orphan: removed"
                echo "- Target certificate count: restored to 2"
              fi
              echo "- Cloudflare secret update: not executed"
              echo "- Production deploy: not executed"
            else
              echo "- Post-rotation deploy proof: passed"
              echo "- Stale same-slot certificate: removed"
              echo "- New certificate + opposite-slot rollback certificate: retained"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary Maintenance material
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/maintenance-rotation"
          rm -f             "$RUNNER_TEMP/graph-access-token"             "$RUNNER_TEMP/entra-maintenance-plan.json"             "$RUNNER_TEMP/add-result.json"             "$RUNNER_TEMP/validation.json"             "$RUNNER_TEMP/finalize-result.json"             "$RUNNER_TEMP/repair-result.json"             "$RUNNER_TEMP/rollback-result.json"             "$RUNNER_TEMP/entra-maintenance-after-repair.json"
