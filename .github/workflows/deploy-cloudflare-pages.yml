name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: true

jobs:
  classify:
    name: Classify production change
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 2
    outputs:
      should_deploy: ${{ steps.classify.outputs.should_deploy }}
    steps:
      - name: Checkout merge metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Detect no-op merge
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "push" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r -a parents <<< "$(git show -s --format='%P' HEAD)"
          if [ "${#parents[@]}" -eq 2 ]; then
            current_tree="$(git rev-parse 'HEAD^{tree}')"
            first_parent_tree="$(git rev-parse 'HEAD^1^{tree}')"
            if [ "$current_tree" = "$first_parent_tree" ]; then
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "No effective production tree change; deployment is skipped."
              exit 0
            fi
          fi
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy production
    needs: classify
    permissions:
      contents: read
      actions: read
    if: needs.classify.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Verify production head and locate exact PR gates
        id: gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"

          read -r -a parents <<< "$(git show -s --format='%P' HEAD)"
          if [ "${#parents[@]}" -ne 2 ]; then
            echo '::error::Production deploy requires a two-parent merge commit with PR provenance.'
            exit 1
          fi
          pr_head_sha="${parents[1]}"
          final_tree_sha="$(git rev-parse 'HEAD^{tree}')"

          find_gate_run() {
            local workflow="$1"
            local response run_id
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?event=pull_request&head_sha=${pr_head_sha}&per_page=20")"
            run_id="$(jq -r --arg head "$pr_head_sha" \
              '[.workflow_runs[] | select(.head_sha == $head and .conclusion == "success")] | sort_by(.run_number) | last | .id // empty' \
              <<< "$response")"
            if ! [[ "$run_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::No successful ${workflow} run exists for PR head ${pr_head_sha}." >&2
              exit 1
            fi
            printf '%s' "$run_id"
          }

          validate_run_id="$(find_gate_run validate-pull-request.yml)"
          runtime_run_id="$(find_gate_run deploy-student-portal.yml)"
          echo "pr_head_sha=${pr_head_sha}" >> "$GITHUB_OUTPUT"
          echo "final_tree_sha=${final_tree_sha}" >> "$GITHUB_OUTPUT"
          echo "validate_run_id=${validate_run_id}" >> "$GITHUB_OUTPUT"
          echo "runtime_run_id=${runtime_run_id}" >> "$GITHUB_OUTPUT"

      - name: Download exact validated production inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-production-inputs-v1
          path: validated-production-inputs
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.gates.outputs.validate_run_id }}

      - name: Download exact PostgreSQL gate provenance
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-postgres-provenance-v1
          path: validated-postgres-provenance
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.gates.outputs.runtime_run_id }}

      - name: Prove both PR gates tested the production tree
        env:
          PR_HEAD_SHA: ${{ steps.gates.outputs.pr_head_sha }}
          FINAL_TREE_SHA: ${{ steps.gates.outputs.final_tree_sha }}
          VALIDATE_RUN_ID: ${{ steps.gates.outputs.validate_run_id }}
          RUNTIME_RUN_ID: ${{ steps.gates.outputs.runtime_run_id }}
        run: >-
          node --experimental-strip-types scripts/ci/provenance-v1.ts verify
          validated-production-inputs/validate-provenance.json
          validated-postgres-provenance/runtime-provenance.json

      - name: Install production deployment dependencies
        run: npm ci --ignore-scripts

      - name: Restore exact validated Pages outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist node_modules/.cache/student-portal-edge node_modules/.cache/student-photo-codec-v1 node_modules/.cache/public-portal-demo node_modules/.cache/public-demo-worker
          cp -a validated-production-inputs/dist dist
          mkdir -p node_modules/.cache
          cp -a validated-production-inputs/node_modules/.cache/student-photo-codec-v1 node_modules/.cache/student-photo-codec-v1
          mkdir -p node_modules/.cache
          cp -a validated-production-inputs/node_modules/.cache/student-portal-edge node_modules/.cache/student-portal-edge
          cp -a validated-production-inputs/node_modules/.cache/public-portal-demo node_modules/.cache/public-portal-demo
          cp -a validated-production-inputs/node_modules/.cache/public-demo-worker node_modules/.cache/public-demo-worker
          test -f dist/index.html
          test -f node_modules/.cache/student-portal-edge/_worker.js
          test -f node_modules/.cache/student-portal-edge/wrangler.jsonc
          test -f node_modules/.cache/public-portal-demo/index.html
          test -f node_modules/.cache/public-demo-worker/index.js

      - name: Verify source-built codec matches the deployed tree
        env:
          PR_HEAD_SHA: ${{ steps.gates.outputs.pr_head_sha }}
          FINAL_TREE_SHA: ${{ steps.gates.outputs.final_tree_sha }}
        run: node scripts/student-photos/verify-codec-artifact-v1.mjs

      - name: Configure private production bindings
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const configPath = 'wrangler.jsonc';
          const config = JSON.parse(await readFile(configPath, 'utf8'));
          if (config.vars?.GRADEBOOK_STORAGE_PROVIDER !== 'postgres') {
            throw new Error('Production requires the explicit PostgreSQL provider.');
          }
          const hyperdrive = config.hyperdrive;
          if (
            !Array.isArray(hyperdrive) ||
            hyperdrive.length !== 2 ||
            hyperdrive[0]?.binding !== 'PROD_DB' ||
            hyperdrive[0]?.id !== '476b417597c84b4c994bd36f1a65cb70' ||
            hyperdrive[1]?.binding !== 'COLLECTOR_DB' ||
            hyperdrive[1]?.id !== '74fa00272a0b420582ccb5e55be6356f' ||
            config.vars?.COLLECTOR_ENABLED !== 'true' ||
            config.vars?.OFFICIAL_ORIGIN !== 'https://admin.escolaieda.com'
          ) {
            throw new Error('Dedicated production Hyperdrive bindings are invalid.');
          }
          const services = config.services;
          if (
            !Array.isArray(services) || services.length !== 2 ||
            services[0]?.binding !== 'PORTAL_SERVICE' ||
            services[0]?.service !== 'student-portal-production' ||
            services[0]?.entrypoint !== 'PortalAdminEntrypoint' ||
            services[1]?.binding !== 'PUBLIC_DEMO_CONTROL' ||
            services[1]?.service !== 'portal-aluno-demo-publica' ||
            services[1]?.entrypoint !== 'DemoControl'
          ) throw new Error('Private Portal/demo entrypoint bindings are invalid.');

          config.env ??= {};
          config.env.production = {
            ...(config.env.production ?? {}),
            vars: config.vars ?? {},
            d1_databases: [],
            hyperdrive,
            services,
          };
          delete config.d1_databases;
          await writeFile(configPath, `${JSON.stringify(config, null, 2)}\n`, 'utf8');
          NODE

      - name: Recheck production head before publishing
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"

      - name: Verify dedicated Hyperdrive cache and pool budgets
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          node --experimental-strip-types scripts/hyperdrive-production-v1.ts --apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_HYPERDRIVE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Refuse overwriting an unrelated public demo Worker
        run: node --experimental-strip-types scripts/ci/public-demo-deploy-preflight-v1.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy exact validated isolated demo before the admin consumer
        run: >-
          ./node_modules/.bin/wrangler deploy
          node_modules/.cache/public-demo-worker/index.js
          --config wrangler.public-demo.jsonc --no-bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy compatible Portal backend before consumers
        run: ./node_modules/.bin/wrangler deploy --config wrangler.student-portal.jsonc --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Portal HTTPS self entrypoint
        run: >-
          ./node_modules/.bin/wrangler pages deploy
          --cwd node_modules/.cache/student-portal-edge
          --project-name student-portal-edge
          --branch main
          --commit-hash "${GITHUB_SHA}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Cloudflare Pages
        run: >-
          ./node_modules/.bin/wrangler pages deploy dist
          --project-name ecossistema-escola
          --branch main
          --commit-hash "${GITHUB_SHA}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
