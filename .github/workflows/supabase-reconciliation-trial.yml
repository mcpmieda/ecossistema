name: Synthetic migration reconciliation trial

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/supabase-reconciliation-trial.yml'
      - 'scripts/ci/supabase-reconciliation-trial/**'

permissions:
  contents: read

concurrency:
  group: reconciliation-trial-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trial:
    name: Synthetic reconciliation PostgreSQL 17.6
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: reconciliation_synthetic_trial
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55473:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reconciliation_synthetic_trial"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Check client availability
        run: command -v psql
      - name: Run synthetic native trial
        env:
          TRIAL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/supabase-reconciliation-trial/run.mjs --native
      - name: Upload synthetic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-reconciliation-trial
          path: scripts/ci/supabase-reconciliation-trial/results.json
          if-no-files-found: error
          retention-days: 14
